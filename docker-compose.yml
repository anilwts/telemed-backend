services:
  api:
    build: .
    ports: ["3000:3000"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemed
      JWT_SECRET: nikhilprjpt15Januarytelemedsolution
      JWT_ISSUER: telemed-api
      JWT_AUDIENCE: telemed-clients
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemed"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  pgdata:
