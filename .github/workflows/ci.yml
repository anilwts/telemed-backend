name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telemed
          POSTGRES_USER: telemed
          POSTGRES_PASSWORD: telemed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemed -d telemed"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm test -- --coverage
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/telemed
          JWT_SECRET: nikhilprjpt15Januarytelemedsolution
          JWT_ISSUER: telemed-api
          JWT_AUDIENCE: telemed-clients
      - name: Build container
        run: docker build -t telemed-api:${{ github.sha }} .
